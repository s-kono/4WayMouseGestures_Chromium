<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>4Way Mouse Gestures</title>
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 16px;
        color: #24292f;
        font: 14px/1.5 system-ui, sans-serif;
      }
      h1 { margin: 0 0 12px; font-size: 15px; }
      label { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
      input { margin-top: 4px; }
      p { margin: 10px 0 0 24px; color: #57606a; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>右ボタン＋ホイールのタブ切り替え</h1>
    <label>
      <input id="reverseScroll" type="checkbox">
      <span>スクロール方向を逆にする</span>
    </label>
    <p>オフ（既定）: ホイール下で次のタブ、上で前のタブ。<br>オン: その逆。</p>
    <script src="popup.js"></script>
  </body>
</html>
